# RealOne kernel settings. The kernel is Linux from Debian; RealOneOS (os/) is the userspace on top of it. Hardening (Aegis) lives in Aegis/.
# build.sh reads this folder: packages from here, boot parameters from cmdline.*.
KERNEL_PKG_PC="linux-image-amd64"
KERNEL_PKG_PI="linux-image-arm64"      # installed from $SUITE-backports together with raspi-firmware
KERNEL_FIRMWARE_PI="raspi-firmware"
