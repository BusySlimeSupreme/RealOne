name: build-realoneos
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo TARGET=pc bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: realoneos-pc
          path: out/realoneos.qcow2
          compression-level: 0
